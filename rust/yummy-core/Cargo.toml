[package]
name = "yummy_core"
version = "0.1.0"
edition = "2021"
description = "Yummy's local recipe brain: extraction, parsing, scaling, pantry matching."

[lib]
name = "yummy_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
